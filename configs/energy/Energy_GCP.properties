# GCP energy model settings for services/python-placement/placement/cspPlacement.py
#
# Node model:
#   P_node(h) = gcp.pue * [gcp.p_vcpu_idle_w * cpu_cap[h]
#                         + (gcp.p_vcpu_active_w - gcp.p_vcpu_idle_w) * cpu_used[h]]
#
# Link model:
#   E_link(edge) = flow_bw * latency_ms * factor(latency tier)
#   tier factors selected by latency thresholds below.



# Google Cloud PUE (uniform) (source: https://datacenters.google/efficiency/)
gcp.pue=1.10

# Power per vCPU slot (Watts) (source: https://www.cloudcarbonfootprint.org/docs/methodology/) 
gcp.p_vcpu_idle_w=0.71
gcp.p_vcpu_active_w=4.26


# Latency thresholds (ms) for link type inference
gcp.lat.intrazone_ms=2.0
gcp.lat.interzone_ms=25.0

# Energy factors by inferred link type
gcp.factor.intrazone=1.0
gcp.factor.interzone=1.5
gcp.factor.crossregion=2.5

# Integer scaling used inside CP-SAT (100 = centi-W)
gcp.energy_scale=100
